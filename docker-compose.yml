services:
  landing:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./landing:/usr/share/nginx/html:ro
    ports:
      - "8081:80"

  admin:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./admin:/usr/share/nginx/html:ro
    ports:
      - "8082:80"

  app:
    build:
      context: ./app
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    ports:
      - "8080:80"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_SECRET=${ADMIN_SECRET}
      - DB_HOST=db
      - DB_NAME=buvette
      - DB_USER=buvette
      - DB_PASS=${DB_PASS}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - REPORT_FROM=${REPORT_FROM:-}
    depends_on:
      db:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    profiles: [dev]
    ports:
      - "1025:1025"
      - "8025:8025"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=buvette
      - POSTGRES_USER=buvette
      - POSTGRES_PASSWORD=${DB_PASS}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buvette -d buvette"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  db_data:

networks:
  default:
    driver: bridge
