server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Service worker et index : jamais en cache pour que les mises à jour PWA soient immédiates
    location ~* (index\.html|sw\.js|workbox-[^.]+\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Assets versionnés (hash dans le nom) : cache long
    location ~* \.(js|css|png|ico|webmanifest|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback (inutilisé ici car pas de router, mais bonne pratique)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
