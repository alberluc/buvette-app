services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./app:/app
      - app_node_modules:/app/node_modules
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:3001}

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3000"
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules

  # En prod, seul Caddy est exposé ; en dev on publie les services directement
  landing:
    ports:
      - "8081:80"

  admin:
    ports:
      - "8082:80"

  db:
    ports:
      - "5432:5432"

volumes:
  app_node_modules:
  api_node_modules:
